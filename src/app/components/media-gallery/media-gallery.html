@if (items.length) {
  <section class="section media-section">
    <div class="container">
      <p class="gallery-kicker">Galerie</p>
      <h2>{{ title }}</h2>
      <div class="media-grid">
        @for (item of items; track item.id) {
          <figure [class.is-video]="item.kind === 'video'">
            @if (item.kind === 'video') {
              <video controls playsinline preload="metadata" [attr.aria-label]="item.title">
                <source [src]="item.url" />
                Votre navigateur ne peut pas lire cette vidéo.
              </video>
            } @else {
              <img [src]="item.url" [alt]="item.title" loading="lazy" />
            }
            <figcaption>{{ item.title }}</figcaption>
          </figure>
        }
      </div>
    </div>
  </section>
}
